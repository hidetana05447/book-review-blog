  <text x="104" y="285" font-family="Hiragino Kaku Gothic ProN, Yu Gothic, sans-serif" font-size="66" font-weight="700" fill="#2b2b2b">嫌われる勇気</text>
  <text x="104" y="352" font-family="Hiragino Kaku Gothic ProN, Yu Gothic, sans-serif" font-size="38" font-weight="700" fill="#2b2b2b">人生の「ハンドル」を、</text>
  <text x="104" y="402" font-family="Hiragino Kaku Gothic ProN, Yu Gothic, sans-serif" font-size="38" font-weight="700" fill="#2b2b2b">誰が握っているか</text>
